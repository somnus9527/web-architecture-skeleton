name: check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 只卡运行时依赖；devDependency 告警交给 Dependabot 跟踪，避免阻塞式门禁常年红。
      - name: Dependency vulnerability audit (prod)
        run: pnpm audit --prod --audit-level=high

      - name: Secret scan
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --redact --exit-code 1

      - name: Repo hygiene
        run: pnpm check:hygiene

      - name: Security scan
        run: pnpm check:security

      - name: License policy
        run: pnpm check:licenses

      - name: Gate self-check
        run: pnpm check:gates

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Mock contract check
        run: pnpm mock:check

      - name: Create CI prod env
        run: |
          cat > .env.prod <<'EOF'
          APP_ENV=prod
          APP_ORIGIN=https://distribution.example.com
          BACKEND_API_BASE_URL=https://api.example.com
          PRISM_MOCK_BASE_URL=http://127.0.0.1:4011
          LOG_LEVEL=info
          SESSION_COOKIE_NAME=distribution_auth
          SESSION_COOKIE_SECURE=true
          CSRF_ENABLED=true
          NEXT_PUBLIC_APP_ENV=prod
          NEXT_PUBLIC_APP_ORIGIN=https://distribution.example.com
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          EOF

      - name: Build
        run: pnpm build:prod

      - name: SEO runtime smoke
        run: |
          PORT=4311 HOSTNAME=127.0.0.1 node --env-file=.env.prod .next/standalone/server.js > /tmp/ssr-seo.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4311/ssr-app-api/health; then break; fi
            sleep 1
          done
          node scripts/check-seo-runtime.mjs --base-url http://127.0.0.1:4311 --origin https://distribution.example.com

      - name: Test
        run: pnpm test:coverage

      - name: SRI policy
        run: pnpm check:sri

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility (axe)
        run: pnpm test:a11y
