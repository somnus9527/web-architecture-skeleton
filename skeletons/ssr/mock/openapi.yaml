openapi: 3.1.0
info:
  title: ssr-app-web mock API
  version: 0.1.0
  description: >
    中性 SSR/BFF 骨架的 Prism mock 契约，仅用于验证健康检查和 showcase 只读链路。
servers:
  - url: http://127.0.0.1:4011
    description: Prism mock server
paths:
  /health:
    get:
      operationId: getHealth
      summary: 健康检查
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    data:
                      status: ok
                    code: '200'
                    codeMsg: null
  /showcase:
    get:
      operationId: getShowcaseList
      summary: showcase 列表
      responses:
        '200':
          description: showcase 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseListResponse'
              examples:
                success:
                  value:
                    data:
                      items:
                        - id: sc-001
                          title: Server Components 直出
                          summary: 首屏内容在服务端 HTML 中，满足 SSR 验证。
                          category: rendering
                          updatedAt: '2026-01-15T08:00:00.000Z'
                        - id: sc-002
                          title: BFF 分层边界
                          summary: gateway 独占出站，adapter 纯映射，UI 只吃 view model。
                          category: architecture
                          updatedAt: '2026-01-20T08:00:00.000Z'
                      total: 2
                    code: '200'
                    codeMsg: null
components:
  schemas:
    HealthResponse:
      type: object
      required: [data, code, codeMsg]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
        code:
          type: string
        codeMsg:
          type: string
          nullable: true
    ShowcaseListResponse:
      type: object
      required: [data, code, codeMsg]
      properties:
        data:
          type: object
          required: [items, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ShowcaseItem'
            total:
              type: integer
        code:
          type: string
        codeMsg:
          type: string
          nullable: true
    ShowcaseItem:
      type: object
      required: [id, title, summary, category, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        category:
          type: string
        updatedAt:
          type: string
          format: date-time
