packages:
  - apps/*
  - packages/*

# 核心依赖统一在这里锁版本，各 app/package 用 catalog: 引用，避免版本漂移。
catalog:
  '@types/node': ^24.10.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^6.0.3
  vite: ^8.3.8
  vitest: ^5.1.1
