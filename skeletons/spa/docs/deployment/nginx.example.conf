server {
    listen 80;
    server_name <public-host>;

    # 发布平台将 dist/ 部署到 /var/www/<project-id>/。
    root /var/www;
    client_max_body_size 20m;

    location = /<project-id> {
        return 308 /<project-id>/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:<api-port>;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /<project-id>/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /<project-id>/version.json {
        try_files $uri =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location ^~ /<project-id>/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /<project-id>/ {
        try_files $uri $uri/ /<project-id>/index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
