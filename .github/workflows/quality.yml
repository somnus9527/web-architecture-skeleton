name: quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skeleton-quality:
    name: ${{ matrix.variant }} quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 三个变体共用同一套工具链版本：Node 取各 skeleton 的 .nvmrc，pnpm 取各自
        # package.json 的 packageManager，不在 matrix 里另写一份。
        variant:
          - spa
          - ssr
          - rn
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: skeletons/${{ matrix.variant }}/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: skeletons/${{ matrix.variant }}/.nvmrc
          cache: pnpm
          cache-dependency-path: skeletons/${{ matrix.variant }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: skeletons/${{ matrix.variant }}
        run: pnpm install --frozen-lockfile

      - name: Generate production env
        if: matrix.variant != 'rn'
        working-directory: skeletons/${{ matrix.variant }}
        run: pnpm env:init prod

      - name: Quality gate
        working-directory: skeletons/${{ matrix.variant }}
        run: pnpm quality:check
