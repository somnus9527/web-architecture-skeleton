name: quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skeleton-quality:
    name: ${{ matrix.variant }} quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 四个变体共用同一套工具链版本：Node 取各 skeleton 的 .nvmrc，pnpm 取各自
        # package.json 的 packageManager，不在 matrix 里另写一份。
        #
        # monorepo 模板按设计不带 pnpm-lock.yaml（派生仓库自行解析），所以它不能跑
        # --frozen-lockfile，也不参与 setup-node 的 pnpm 缓存。
        include:
          - variant: spa
            install: pnpm install --frozen-lockfile
            gate: pnpm quality:check
            prodEnv: true
            cached: true
          - variant: ssr
            install: pnpm install --frozen-lockfile
            gate: pnpm quality:check
            prodEnv: true
            cached: true
          - variant: rn
            install: pnpm install --frozen-lockfile
            gate: pnpm quality:check
            prodEnv: false
            cached: true
          - variant: monorepo
            # 模板不带锁文件，而 GitHub Actions 默认 CI=true 会让 pnpm 走 frozen，必须显式关掉。
            install: pnpm install --no-frozen-lockfile
            gate: pnpm check && pnpm build
            prodEnv: false
            cached: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: skeletons/${{ matrix.variant }}/package.json

      - name: Setup Node (with pnpm cache)
        if: matrix.cached
        uses: actions/setup-node@v7
        with:
          node-version-file: skeletons/${{ matrix.variant }}/.nvmrc
          cache: pnpm
          cache-dependency-path: skeletons/${{ matrix.variant }}/pnpm-lock.yaml

      - name: Setup Node (no cache)
        if: ${{ !matrix.cached }}
        uses: actions/setup-node@v7
        with:
          node-version-file: skeletons/${{ matrix.variant }}/.nvmrc

      - name: Install dependencies
        working-directory: skeletons/${{ matrix.variant }}
        run: ${{ matrix.install }}

      # 只卡运行时依赖：devDependency 的告警常年存在且不影响产物，交给 Dependabot/renovate
      # 跟踪；把它们放进阻塞式门禁只会训练团队忽略红灯。
      - name: Dependency vulnerability audit (prod)
        if: matrix.cached
        working-directory: skeletons/${{ matrix.variant }}
        run: pnpm audit --prod --audit-level=high

      - name: Generate production env
        if: matrix.prodEnv
        working-directory: skeletons/${{ matrix.variant }}
        run: pnpm env:init prod

      - name: Quality gate
        working-directory: skeletons/${{ matrix.variant }}
        run: ${{ matrix.gate }}

  a11y:
    name: ${{ matrix.variant }} a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [spa, ssr]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: skeletons/${{ matrix.variant }}/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: skeletons/${{ matrix.variant }}/.nvmrc
          cache: pnpm
          cache-dependency-path: skeletons/${{ matrix.variant }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: skeletons/${{ matrix.variant }}
        run: pnpm install --frozen-lockfile

      # 浏览器只在 a11y job 里装：quality 矩阵不背这 100 MB 和安装时间。
      - name: Install Chromium
        working-directory: skeletons/${{ matrix.variant }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility (axe, serious/critical must be zero)
        working-directory: skeletons/${{ matrix.variant }}
        run: pnpm test:a11y
