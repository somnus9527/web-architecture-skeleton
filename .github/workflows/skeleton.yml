name: skeleton

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Toolchain versions
        run: node tools/check-toolchain.mjs

      - name: Materialized artifacts match sources
        run: |
          node tools/materialize.mjs
          git diff --exit-code

      - name: Documentation links
        run: node tools/check-doc-links.mjs

      - name: Init smoke test
        run: node tools/check-init-smoke.mjs

      - name: Monorepo template boundaries
        working-directory: skeletons/monorepo
        run: node scripts/check-workspace.mjs
