name: skeleton

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialized artifacts match sources
        run: |
          node tools/materialize.mjs
          git diff --exit-code

      - name: Init smoke test
        run: node tools/check-init-smoke.mjs

      - name: Monorepo template boundaries
        working-directory: templates/monorepo
        run: node scripts/check-workspace.mjs
